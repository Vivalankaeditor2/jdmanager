# JD Manager — HTTP-only bootstrap vhost (used before a TLS cert exists).
#
# Install at /etc/nginx/conf.d/zzz-jd-manager.conf, obtain the certificate,
# then replace with jd-manager.conf (HTTPS redirect + reverse proxy).
# The "zzz-" prefix keeps this block sorting last (see jd-manager.conf).

server {
    listen @@IP@@:80;
    listen [@@IP6@@]:80;
    server_name @@HOST@@;

    access_log /var/log/nginx/jd-manager-access.log;
    error_log  /var/log/nginx/jd-manager-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:@@PORT@@/;
    }
}
