# JD Manager — nginx vhost (HTTP -> HTTPS redirect + ACME, HTTPS reverse proxy)
#
# Deployed as /etc/nginx/conf.d/zzz-jd-manager.conf
# NOTE: the "zzz-" prefix is REQUIRED. This nginx has no explicit
# default_server, so the first server block per IP:port in include order is
# the implicit default. Sorting last preserves the pre-existing default vhost.
#
# Replace @@HOST@@ (domain), @@IP@@ (public IPv4) and @@IP6@@ (public IPv6)
# before installing, or run deploy/deploy-server.sh which does it for you.

server {
    listen @@IP@@:80;
    listen [@@IP6@@]:80;
    server_name @@HOST@@;

    access_log /var/log/nginx/jd-manager-access.log;
    error_log  /var/log/nginx/jd-manager-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen @@IP@@:443 ssl;
    listen [@@IP6@@]:443 ssl;
    server_name @@HOST@@;

    ssl_certificate     /etc/letsencrypt/live/@@HOST@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@HOST@@/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/jd-manager-ssl-access.log;
    error_log  /var/log/nginx/jd-manager-ssl-error.log warn;

    client_max_body_size 10m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:@@PORT@@/;
    }
}
